name: tracker-infra

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Scan Terraform and Helm for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.76.1
          severity: CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Terraform
        run: |
          for dir in terraform eks; do
            terraform -chdir=$dir init -backend=false
            terraform -chdir=$dir validate
          done

      - name: Set up Helm
        uses: Azure/setup-helm@v5

      - name: Lint the Helm chart
        run: helm lint helm/tracker-chart

      - name: Lint the Helm chart with each values file
        run: |
          for values in values-kind.yaml values-eks.yaml; do
            helm lint helm/tracker-chart -f helm/tracker-chart/$values
          done
