{{- if .Values.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccountName }}
  labels:
    app.kubernetes.io/name: tracker
  {{- with .Values.externalSecrets.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tracker-aws
  labels:
    app.kubernetes.io/name: tracker
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracker-db-secret
  labels:
    app.kubernetes.io/name: tracker
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: tracker-aws
    kind: SecretStore
  target:
    name: tracker-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.dbPasswordSecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracker-secret
  labels:
    app.kubernetes.io/name: tracker
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: tracker-aws
    kind: SecretStore
  target:
    name: tracker-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.sessionKeySecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
