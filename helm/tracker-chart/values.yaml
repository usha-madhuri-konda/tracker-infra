replicaCount: 2

image:
  repository: ushamadhurikonda/tracker-app
  tag: v0.2.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000
  nodePort: null

config:
  allowRegistration: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

postgres:
  image: postgres:16
  database: trackerdb
  storage:
    size: 1Gi
    className: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

storageClass:
  create: false
