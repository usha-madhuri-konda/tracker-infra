apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/usha-madhuri-konda/tracker-infra.git
    targetRevision: main
    path: helm/tracker-chart
    helm:
      valueFiles:
        - values.yaml
        - values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
